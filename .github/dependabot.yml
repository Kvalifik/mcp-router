version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      routine:
        patterns: ['*']
        update-types: [minor, patch]
        exclude-patterns:
          - '@modelcontextprotocol/*'
          - '@electron/*'
          - electron
          - '@decimalturn/toml-patch'
          - ajv
          - zod
          - jsonc-parser
      runtime-and-security:
        update-types: [minor, patch]
        patterns:
          - '@modelcontextprotocol/*'
          - '@electron/*'
          - electron
          - '@decimalturn/toml-patch'
          - ajv
          - zod
          - jsonc-parser
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ['*']
        update-types: [minor, patch]
