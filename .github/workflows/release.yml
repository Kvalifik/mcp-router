name: Release
on:
  workflow_dispatch:
    inputs:
      create_draft:
        description: Create a draft release after building (leave off to validate only)
        required: true
        type: boolean
        default: false
      sign_mac:
        description: Sign and notarize Mac apps (requires mac-signing environment credentials)
        required: true
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: darwin
            arch: arm64
          - os: macos-15-intel
            platform: darwin
            arch: x64
          - os: windows-2022
            platform: win32
            arch: x64
    runs-on: ${{ matrix.os }}
    environment: ${{ inputs.sign_mac && matrix.platform == 'darwin' && 'mac-signing' || 'build' }}
    defaults:
      run:
        shell: bash
    env:
      BUILD_PLATFORM: ${{ matrix.platform }}
      BUILD_ARCH: ${{ matrix.arch }}
      MAC_SIGNING_MODE: ${{ inputs.sign_mac && 'developer-id' || 'adhoc' }}
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Validate version and release notes
        id: version
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const {version} = JSON.parse(fs.readFileSync('package.json'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json'));
          if (!/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(version)) throw Error('Expected a stable semantic version');
          if (lock.version !== version || lock.packages[''].version !== version) throw Error('Lockfile version mismatch');
          if (!fs.readFileSync('CHANGELOG.md', 'utf8').includes(`## ${version} —`)) throw Error('Add a changelog entry first');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\n`);
          JS
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - name: Prepare temporary Mac signing keychain
        if: inputs.sign_mac && matrix.platform == 'darwin'
        env:
          CERTIFICATE: ${{ secrets.MAC_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          SIGNING_IDENTITY: ${{ vars.MAC_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$CERTIFICATE" && test -n "$CERTIFICATE_PASSWORD"
          test -n "$SIGNING_IDENTITY" && test -n "$APPLE_ID"
          test -n "$APPLE_APP_PASSWORD" && test -n "$APPLE_TEAM_ID"
          keychain="$RUNNER_TEMP/router-signing.keychain-db"
          certificate="$RUNNER_TEMP/router-signing.p12"
          password=$(openssl rand -hex 32)
          echo "::add-mask::$password"
          printf '%s' "$CERTIFICATE" | base64 --decode > "$certificate"
          chmod 600 "$certificate"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 7200 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          python3 - <<'PYTHON'
          import json, os, pathlib, shlex, subprocess
          folder = pathlib.Path(os.environ['RUNNER_TEMP'])
          original = shlex.split(subprocess.check_output(['security', 'list-keychains', '-d', 'user'], text=True))
          (folder / 'router-keychain-search-list.json').write_text(json.dumps(original))
          subprocess.run(['security', 'list-keychains', '-d', 'user', '-s', str(folder / 'router-signing.keychain-db'), *original], check=True)
          PYTHON
          security import "$certificate" -P "$CERTIFICATE_PASSWORD" -k "$keychain" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" > /dev/null
          xcrun notarytool store-credentials router-notary --keychain "$keychain" \
            --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" --team-id "$APPLE_TEAM_ID"
          rm -f "$certificate"
          printf 'MAC_SIGNING_IDENTITY=%s\nMAC_SIGNING_KEYCHAIN=%s\nMAC_NOTARY_PROFILE=router-notary\n' \
            "$SIGNING_IDENTITY" "$keychain" >> "$GITHUB_ENV"
      - run: npm run build:desktop
      - run: node scripts/smoke-package.mjs
      - run: python3 scripts/package-release.py
      - name: Remove temporary signing credentials
        if: always() && inputs.sign_mac && matrix.platform == 'darwin'
        run: |
          if [ -f "$RUNNER_TEMP/router-signing.keychain-db" ]; then
            security delete-keychain "$RUNNER_TEMP/router-signing.keychain-db"
          fi
          rm -f "$RUNNER_TEMP/router-signing.p12"
          python3 - <<'PYTHON'
          import json, os, pathlib, subprocess
          saved = pathlib.Path(os.environ['RUNNER_TEMP']) / 'router-keychain-search-list.json'
          if saved.exists():
              subprocess.run(['security', 'list-keychains', '-d', 'user', '-s', *json.loads(saved.read_text())], check=True)
              saved.unlink()
          PYTHON
      - run: git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/release/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
  draft:
    needs: build
    if: inputs.create_draft
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release
      - name: Verify and create draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          RELEASE_COMMIT: ${{ github.sha }}
        working-directory: release
        run: |
          cat SHA256SUMS-*.txt > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
          shopt -s nullglob
          feeds=(update-mac-*.json)
          gh release create "v$RELEASE_VERSION" MCP-Router-*.zip SHA256SUMS.txt "${feeds[@]}" \
            --target "$RELEASE_COMMIT" --title "MCP Router v$RELEASE_VERSION" \
            --draft --notes-file release-notes.md
